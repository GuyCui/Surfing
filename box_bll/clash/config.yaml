# 用于下载订阅时指定UA
global-ua: clash.meta

# 全局配置
# HTTP/SOCKS 混合代理端口
mixed-port: 7891
ipv6: true
# 工作模式为规则模式
mode: rule
allow-lan: true
# 绑定地址，默认为所有 IP 地址
bind-address: "*"
unified-delay: true
tcp-concurrent: true
# interface-name: eth0  （路由器下根据情况指定出站接口）
authentication:
#  密码设置选项默认无
- "guy:Guy!23"
skip-auth-prefixes:
- 127.0.0.1/8
- 192.168.2.0/24
- ::1/128

geodata-mode: false
# GeoSite 使用的匹配器实现
geosite-matcher: succinct
# GEO 文件加载模式（standard：标准加载器/memconservative：专为内存受限 (小内存) 设备优化的加载器 (默认值)）
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb"
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# 控制面板
external-controller: 0.0.0.0:9093
secret: "Guy!23"
#  密码设置选项默认无
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 匹配进程 always/strict/off
find-process-mode: strict
global-client-fingerprint: random
keep-alive-idle: 600
keep-alive-interval: 30

# 实验性功能配置
experimental:
  quic-go-disable-gso: true # 禁用 QUIC 协议中的 GSO (Generic Segmentation Offload) 功能
  quic-go-disable-ecn: true #禁用ECN
  dialer-ip4p-convert: false # 启用IP4P地址转换

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: false

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "*.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "*.push.apple.com"
    - "*.apple.com"
    - "*.wechat.com"
    - "*.qpic.cn"
    - "*.qq.com"
    - "*.wechatapp.com"
    - "*.vivox.com"
    - "*.cuihome.com"
    # 向日葵服务
    - "*.oray.com"
    - "*.sunlogin.net"

# 代理模式
tun:
  exclude-package: []
  enable: true
  device: Meta
  inet6-address:
  stack: gvisor
  mtu: 1500
  gso: true # 通用分段卸载 (GSO)，提高网络性能
  gso-max-size: 65536 # 设置 GSO 最大分段大小为 65536 字节
  udp-timeout: 300 # 设置 UDP 超时时间为 300 秒，优化 NAT 映射
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  # 自动根据流量选择最佳路由
  auto-route: true
  # 强制使用严格路由，避免流量被错误路由
  strict-route: true
  # 自动重定向不匹配规则的流量
  auto-redirect: true
  # 自动检测并使用适当的网络接口
  auto-detect-interface: true
  endpoint-independent-nat: false

# DNS模块
dns:
  enable: true
  # 缓存算法，参数:lru 最近最少使用，arc 自适应替换缓存
  cache-algorithm: arc
  listen: 0.0.0.0:53
  ipv6: true
  # 是否开启 DoH 支持 HTTP/3，将并发尝试
  prefer-h3: false
  # 使用系统的 hosts 文件条目
  use-system-hosts: true
  # dns 连接遵守路由规则，需配置 proxy-server-nameserver, 强烈不建议和 prefer-h3 一起使用
  respect-rules: true
  # 模式切换 redir-host / fake-ip
  enhanced-mode: fake-ip
  # fake-ip 池设置
  fake-ip-range: 28.0.0.1/8
  # 模式切换 whitelist/blacklist
  # 黑名单模式表示如果匹配成功则不返回 Fake-IP, 白名单模式时只有匹配成功才返回 Fake-IP
  fake-ip-filter-mode: blacklist
  # 是否遵循 nameserver-policy，默认为不遵守，仅当 direct-nameserver 不为空时生效
  direct-nameserver-follow-policy: true
  fake-ip-filter:
    - "rule-set:fakeip_filter_domain,game_cn_domain,bank_cn_domain,wechat_domain,ai_cn_domain,NetEaseMusic_domain,fcm_domain,alibaba_domain,fcm_domain,media_cn_domain,xiaomi_domain,pt_cn_domain,public-tracker_domain,115_domain,aliyun_domain,direct_domain,apple_cn_domain,apple_firmware_domain,iptv_domain,private_domain,cn_domain,fakeip-filter"
    - '+.cuihome.com'
  nameserver-policy:
    'geosite:cn':
       - https://dns.alidns.com/dns-query # DoH
       - https://doh.pub/dns-query # DoH
    'geosite:!cn':
       - https://cloudflare-gateway.com/dns-query
    'github.akams.cn':
       - 202.102.128.68
       - 202.102.134.68
    "+.jp":
       - "https://public.dns.iij.jp/dns-query#h3=true" # IIJ （日本） DNS over H3
    "+.hk":
       - "quic://dns.nextdns.io" # NextDNS（香港） DNS over DOQ
    "+.eu":
       - "quic://dns0.eu" # 公共（欧洲） DNS over DOQ
    "RULE-SET:Private,China":
       - 202.102.128.68
       - 202.102.134.68
  default-nameserver:
    - 202.102.128.68
    - 202.102.134.68
  nameserver:
    - "https://1.1.1.1/dns-query#h3=true" # Cloudflare DNS over H3
    - "https://dns.google/dns-query#h3=true" # Google DNS over H3
  proxy-server-nameserver: # 代理节点域名解析服务器，仅用于解析代理节点的域名
    - 223.5.5.5
    - "https://223.5.5.5/dns-query"
    - "https://1.12.12.12/dns-query"
  direct-nameserver: #  用于直连出口域名解析的 DNS 服务器
    - 202.102.128.68
    - 202.102.134.68

proxies:
  - name: "全球直连"
    type: direct
    udp: true


